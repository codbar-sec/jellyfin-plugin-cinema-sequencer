# Example only. Adapt paths, user IDs and image to your setup.
# Only the volumes marked NEW matter for Cinema Sequencer.
services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1000:1000"                  # the UID:GID Jellyfin runs as
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /path/to/your/media:/media:ro  # your library, often read-only

      # NEW: a writable folder for downloaded trailers. It must be owned by the user above.
      #   mkdir -p ./trailers && chown 1000:1000 ./trailers
      - ./trailers:/trailers

      # NEW: yt-dlp (standalone Linux binary, made executable). Not included in the Jellyfin image.
      - ./yt-dlp:/usr/local/bin/yt-dlp:ro

      # NEW (optional): the folder holding your intro video. Add /preroll as a Movies library in Jellyfin.
      - ./preroll:/preroll:ro
    restart: unless-stopped

# Then in Jellyfin:
#   Libraries: add /trailers and /preroll as separate Movies libraries and scan them.
#   Plugin settings: Download folder = /trailers, Custom intro = /preroll/intro.mp4,
#                    ffmpeg path = /usr/lib/jellyfin-ffmpeg/ffmpeg
