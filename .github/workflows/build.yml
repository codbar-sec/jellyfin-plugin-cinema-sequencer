name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Scan for secrets and personal data
        run: bash scripts/check-no-secrets.sh

      - name: Build
        run: dotnet build Jellyfin.Plugin.CinemaSequencer.sln -c Release

      - name: Package (dry run)
        run: bash scripts/package.sh 0.0.0.0 dist

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-sequencer-dev-build
          path: dist/*.zip
          if-no-files-found: error
